<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUDIS Season 2 Airdrop Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 28px 14px 48px;
    }

    .container { max-width: 680px; margin: 0 auto; }

    /* Header */
    header { text-align: center; margin-bottom: 28px; }
    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    header p { color: #888; font-size: 0.88rem; }
    .total-badge {
      display: inline-block;
      margin-top: 10px;
      background: linear-gradient(135deg, #4c1d95, #1e3a5f);
      border: 1px solid #6d28d9;
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #c4b5fd;
    }

    /* Card */
    .card {
      background: #13132a;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6d6d9e;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    /* Item card */
    .item {
      background: #1a1a34;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: fadeIn 0.18s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .item-num {
      font-size: 0.72rem;
      color: #555;
      width: 18px;
      flex-shrink: 0;
      text-align: right;
    }
    .item-top input[type="text"] {
      flex: 1;
      background: #0f0f26;
      border: 1px solid #2e2e52;
      border-radius: 8px;
      color: #e0e0f0;
      padding: 9px 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .item-top input[type="text"]:focus { border-color: #7c3aed; }
    .item-top input[type="text"]::placeholder { color: #3a3a5c; }

    .del-btn {
      width: 34px; height: 34px;
      flex-shrink: 0;
      background: none;
      border: 1px solid #2e2e52;
      border-radius: 8px;
      color: #555;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .del-btn:active { border-color: #ef4444; color: #ef4444; background: #1f0f0f; }

    .item-bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 26px;
    }

    .rate-wrap {
      display: flex;
      align-items: center;
      background: #0f0f26;
      border: 1px solid #2e2e52;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
      width: 110px;
      flex-shrink: 0;
    }
    .rate-wrap:focus-within { border-color: #7c3aed; }
    .rate-wrap input[type="number"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #e0e0f0;
      padding: 9px 10px;
      font-size: 1rem;
      outline: none;
      min-width: 0;
      -moz-appearance: textfield;
    }
    .rate-wrap input[type="number"]::-webkit-inner-spin-button,
    .rate-wrap input[type="number"]::-webkit-outer-spin-button { display: none; }
    .rate-unit { padding: 0 10px 0 2px; color: #6d6d9e; font-size: 0.9rem; user-select: none; }

    .arrow { color: #3a3a5c; font-size: 0.9rem; flex-shrink: 0; }

    .result-cell {
      flex: 1;
      text-align: right;
      font-size: 1rem;
      font-weight: 700;
      color: #a78bfa;
    }

    /* Add button */
    .add-btn {
      width: 100%;
      padding: 12px;
      background: #1c1c38;
      border: 1px dashed #2e2e52;
      border-radius: 10px;
      color: #5a5a8e;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .add-btn:active { border-color: #7c3aed; color: #a78bfa; background: #1c1c42; }

    /* Summary grid */
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .summary-item {
      background: #1a1a35;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }
    .summary-item.warn { border-color: #92400e; background: #1a1208; }
    .summary-item.ok   { border-color: #065f46; background: #071a12; }
    .s-label {
      font-size: 0.68rem;
      color: #6d6d9e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 5px;
    }
    .s-value { font-size: 1.15rem; font-weight: 700; }
    .s-value.purple { color: #a78bfa; }
    .s-value.green  { color: #34d399; }
    .s-value.orange { color: #fbbf24; }
    .s-value.red    { color: #f87171; }

    /* Reset */
    .reset-btn {
      background: none;
      border: 1px solid #2e2e52;
      border-radius: 8px;
      color: #555;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .reset-btn:active { border-color: #6d28d9; color: #a78bfa; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>CUDIS Airdrop Calculator</h1>
    <p>Season 2 예상 에어드랍 물량 계산기</p>
    <span class="total-badge">총 물량 50,000,000 CUDIS</span>
  </header>

  <div class="card">
    <div class="header-row">
      <div class="card-title">항목별 비율 입력</div>
      <button class="reset-btn" onclick="resetAll()">초기화</button>
    </div>
    <div id="rows"></div>
    <button class="add-btn" onclick="addRow()">+ 항목 추가</button>
  </div>

  <div class="card">
    <div class="card-title" style="margin-bottom:14px">요약</div>
    <div class="summary">
      <div class="summary-item">
        <div class="s-label">총 물량</div>
        <div class="s-value purple">50,000,000</div>
      </div>
      <div class="summary-item" id="sum-box">
        <div class="s-label">합산 비율</div>
        <div class="s-value orange" id="sum-rate">0%</div>
      </div>
      <div class="summary-item">
        <div class="s-label">합산 물량</div>
        <div class="s-value purple" id="sum-amount">0</div>
      </div>
      <div class="summary-item">
        <div class="s-label">잔여 물량</div>
        <div class="s-value orange" id="remain-amount">50,000,000</div>
      </div>
    </div>
  </div>
</div>

<script>
  const TOTAL = 50_000_000;
  let rowId = 0;
  const rowsEl = document.getElementById('rows');

  function addRow(name = '', rate = '') {
    rowId++;
    const id = rowId;
    const div = document.createElement('div');
    div.className = 'item';
    div.id = `row-${id}`;
    div.innerHTML = `
      <div class="item-top">
        <span class="item-num" id="num-${id}"></span>
        <input type="text" placeholder="항목명 (예: Tier 1)" id="name-${id}" />
        <button class="del-btn" onclick="removeRow(${id})">×</button>
      </div>
      <div class="item-bottom">
        <div class="rate-wrap">
          <input type="number" inputmode="decimal" min="0" max="100" step="0.01"
                 placeholder="0" id="rate-${id}" oninput="calc()" />
          <span class="rate-unit">%</span>
        </div>
        <span class="arrow">→</span>
        <div class="result-cell" id="res-${id}">—</div>
      </div>
    `;
    rowsEl.appendChild(div);
    if (name) document.getElementById(`name-${id}`).value = name;
    if (rate) document.getElementById(`rate-${id}`).value = rate;
    renumber();
    calc();
  }

  function removeRow(id) {
    const el = document.getElementById(`row-${id}`);
    if (el) el.remove();
    renumber();
    calc();
  }

  function renumber() {
    rowsEl.querySelectorAll('.item').forEach((r, i) => {
      const n = r.querySelector('[id^="num-"]');
      if (n) n.textContent = i + 1;
    });
  }

  function calc() {
    let totalRate = 0;
    rowsEl.querySelectorAll('.item').forEach(r => {
      const id = r.id.replace('row-', '');
      const rateEl = document.getElementById(`rate-${id}`);
      const resEl  = document.getElementById(`res-${id}`);
      if (!rateEl || !resEl) return;
      const rate = parseFloat(rateEl.value) || 0;
      totalRate += rate;
      const amount = Math.floor(TOTAL * rate / 100);
      resEl.textContent = amount > 0 ? amount.toLocaleString() + ' CUDIS' : '—';
    });

    const sumAmount = Math.floor(TOTAL * totalRate / 100);
    const remain    = TOTAL - sumAmount;

    document.getElementById('sum-rate').textContent   = totalRate.toFixed(2) + '%';
    document.getElementById('sum-amount').textContent = sumAmount.toLocaleString();
    document.getElementById('remain-amount').textContent = remain.toLocaleString();

    const sumBox    = document.getElementById('sum-box');
    const sumRateEl = document.getElementById('sum-rate');
    const remainEl  = document.getElementById('remain-amount');

    if (totalRate > 100) {
      sumBox.className = 'summary-item warn';
      sumRateEl.className = 's-value red';
    } else if (totalRate === 100) {
      sumBox.className = 'summary-item ok';
      sumRateEl.className = 's-value green';
    } else {
      sumBox.className = 'summary-item';
      sumRateEl.className = 's-value orange';
    }
    remainEl.className = remain < 0 ? 's-value red' : remain === 0 ? 's-value green' : 's-value orange';
  }

  function resetAll() {
    rowsEl.innerHTML = '';
    rowId = 0;
    addRow(); addRow(); addRow();
  }

  addRow('Tier 1');
  addRow('Tier 2');
  addRow('Tier 3');
</script>
</body>
</html>
